---
# Leviosa Inventory
# Usage: make setup (or the ansible-playbook form in README.md)

all:
  children:
    leviosa_servers:
      hosts:
        leviosa_vps:
          # Placeholder: always passed with -e ansible_host=… (`make setup`
          # reads it from Terraform through ../terraform/tf.sh)
          ansible_host: YOUR_VPS_IP
          # Ansible always connects as root, with this computer's own key from
          # the keys file. The deploy user can only run the deploy gate.
          ansible_user: root

      vars:
        # Application
        app_name: leviosa
        # Overridden by `make setup` with Terraform's domain_name output.
        app_domain: "{{ lookup('env', 'APP_DOMAIN') | default('leviosa.care', true) }}"

        # SSH Configuration (roles/ssh)
        ssh_port: 22
        ssh_password_authentication: false
        # Root logs in with a key only (each operator computer's own key).
        # Options: "yes", "no", "prohibit-password" (key-only)
        ssh_permit_root_login: "prohibit-password"
        ssh_allowed_users: ["root", "{{ deploy_user }}"]

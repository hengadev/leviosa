---
# Leviosa VPS - Complete Setup
# Usage (or `make setup` from infra/ansible or the repository root):
#
#   ansible-playbook -i inventory/hosts.yml playbooks/site.yml \
#     -e "ansible_host=$(../terraform/tf.sh output -raw server_ipv4_address)" \
#     -e @$HOME/leviosa-deploy-keys.yml
#
# Needs only this computer's SSH key (listed in the keys file) and
# `infisical login` on the control machine: no local secret files, no Ansible
# Vault (ADR-0017). The keys file holds deploy_ssh_public_keys (one per
# operator computer: root and the deploy user) and deploy_ci_ssh_public_keys
# (the CI key, forced to the deploy gate); see playbooks/group_vars/all.yml
# and ../deploy-keys.example.yml.
#
# Ansible sets the server up; it never releases the app. Releases are
# `deploy <stack> <sha>` through the deploy gate (roles/deploy_gate,
# infra/compose/), run by CI.

- name: Leviosa VPS - Complete Setup
  hosts: leviosa_servers
  gather_facts: true

  vars:
    # The `leviosa` Infisical project (Infisical > leviosa > Project settings
    # > Project ID; the same value as infisical_project_id in
    # infra/terraform/terraform.tfvars). Not a secret. A play var rather than
    # a group var so it is also visible to the delegated-to-localhost lookup
    # below.
    # OPERATOR: replace the placeholder before the first `make setup`; until
    # then the lookup is skipped and the fallback address is used.
    infisical_project_id: "REPLACE_WITH_LEVIOSA_PROJECT_ID"

    # What the lookup below must print: exactly one NOTIFY_EMAIL=<address>
    # line, the address optionally quoted. Anything else (a missing secret
    # is printed as a placeholder, an error message) is not an address.
    # Group 2 is the address. A folded scalar: no YAML escape processing.
    leviosa_notify_email_pattern: >-
      ^NOTIFY_EMAIL=(['"]?)([^@\s'"]+@[^@\s'"]+)\1$

  pre_tasks:
    - name: Display target host
      ansible.builtin.debug:
        msg: "Setting up {{ inventory_hostname }} ({{ ansible_facts['default_ipv4']['address'] | default(ansible_host) }}) for {{ app_name }}"

    - name: Check if running as root
      ansible.builtin.assert:
        that:
          - ansible_user == 'root'
        fail_msg: "The setup connects as root (with this computer's key from the keys file); the deploy user can only deploy."
        quiet: true
      tags: ['always']

    # The notification email (fail2ban, unattended-upgrades) is the one value
    # the setup needs that is not a file on the target. It is read from
    # Infisical prod /host on the control node through the operator's own
    # `infisical login`: never from the repo, never from a local encrypted
    # file (ADR-0017). Read-only, so it also runs in --check. no_log because
    # the CLI output passes through.
    - name: Look up NOTIFY_EMAIL in Infisical prod /host through the operator's login
      ansible.builtin.command:
        argv:
          - infisical
          - secrets
          - get
          - NOTIFY_EMAIL
          - "--projectId={{ infisical_project_id }}"
          - --env=prod
          - --path=/host
          - --output=dotenv
          - --silent
      delegate_to: localhost
      become: false
      register: leviosa_notify_lookup
      changed_when: false
      check_mode: false
      failed_when: false
      no_log: true
      # always: a run limited with --tags (fail2ban, system) must not render
      # the fallback address over the real one.
      tags: ['always']
      when: infisical_project_id is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')

    - name: Apply the notification email from Infisical /host
      ansible.builtin.set_fact:
        # regex_findall gives [(quote, address)]: no backreference, so no
        # backslash to survive YAML and Jinja quoting.
        host_notify_email: "{{ leviosa_notify_lookup.stdout | trim | regex_findall(leviosa_notify_email_pattern) | first | last }}"
      when:
        - leviosa_notify_lookup is not skipped
        - leviosa_notify_lookup.rc == 0
        - leviosa_notify_lookup.stdout | trim is match(leviosa_notify_email_pattern)
      no_log: true
      tags: ['always']

    - name: Warn when the notification email could not be read from Infisical
      ansible.builtin.debug:
        msg: >-
          WARNING: could not read NOTIFY_EMAIL from Infisical prod /host
          ({{ 'infisical_project_id is still a placeholder in playbooks/site.yml'
          if leviosa_notify_lookup is skipped
          else 'infisical exited with ' ~ leviosa_notify_lookup.rc ~ ' or printed no address' }}).
          Using the fallback '{{ host_notify_email }}' for fail2ban and
          unattended-upgrades notifications. Install the Infisical CLI, run
          `infisical login`, check the project ID and /host NOTIFY_EMAIL, and
          re-run the setup to fix this.
      tags: ['always']
      when: >-
        leviosa_notify_lookup is skipped
        or leviosa_notify_lookup.rc != 0
        or not (leviosa_notify_lookup.stdout | trim is match(leviosa_notify_email_pattern))

  roles:
    - role: system
      tags: ['system', 'setup']

    - role: docker
      tags: ['docker', 'setup']

    # The deploy user, root's and the deploy user's operator keys. Before
    # roles/deploy_gate, which needs the user to exist (issue 022).
    - role: user
      tags: ['user', 'setup']

    # The CI keys' forced command, the root runner and the deploy user's only
    # sudoers rule; the CI keys' block at the top of its authorized_keys.
    - role: deploy_gate
      tags: ['deploy_gate', 'user', 'setup']

    - role: ssh
      tags: ['ssh', 'security']

    - role: fail2ban
      tags: ['fail2ban', 'security']

    - role: firewall
      tags: ['firewall', 'security']

    # Stack roots, root-only env directories, data and Caddy directories.
    - role: app
      tags: ['app', 'setup']

    # The Caddyfile into the prod stack root; reloaded only into a running
    # Caddy (issue 026).
    - role: caddy
      tags: ['caddy', 'web']

    # Still to come, in this order:
    #   infisical_agent  the Agent rendering env/*.env (needs the
    #                    leviosa-vps credential exported)             (issue 027)

    # Postgres, RabbitMQ and Caddy up (never recreated); staging's database
    # role and each environment's RabbitMQ vhost and user, from Infisical
    # through the operator's login. After the Agent: needs its env files, and
    # is skipped with a warning without them (issue 026).
    - role: shared_services
      tags: ['shared_services', 'setup']

    # Still to come:
    #   backup           daily dump, weekly snapshot, restore test    (issue 028)

  post_tasks:
    - name: Display setup completion message
      ansible.builtin.debug:
        msg:
          - "==========================================="
          - "Leviosa VPS Setup Complete!"
          - "==========================================="
          - ""
          - "Server: {{ ansible_facts['default_ipv4']['address'] | default(ansible_host) }}"
          - "Domain: {{ app_domain }}"
          - "Deploy user: {{ deploy_user }} (deploy gate only)"
          - "Stack roots: {{ app_prod_root }}, {{ app_staging_root }}"
          - "Notifications: {{ host_notify_email }}"
          - ""
          - "Run `make setup` again: the second run must report changed=0."
          - "Releases never go through Ansible: CI runs `deploy <stack> <sha>`"
          - "through the deploy gate (infra/compose/README.md)."
          - "==========================================="

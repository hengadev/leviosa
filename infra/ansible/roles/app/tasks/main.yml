---
# App layout: the compose stacks' directories, and nothing else.
#
# Everything that used to be rendered here belongs to another mechanism now:
#   env/*.env              the Infisical Agent (issue 027)
#   docker-compose.yml     installed by the deploy runner from the deployed
#                          commit (roles/deploy_gate)
#   caddy/etc/Caddyfile    roles/caddy (issue 026)
# Releases never go through Ansible: CI asks for `deploy <stack> <sha>` over
# SSH and the deploy gate runs it (infra/compose/README.md).

- name: Create the compose stack directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0750') }}"
  loop: "{{ app_stack_directories }}"
  loop_control:
    label: "{{ item.path }}"

---
# roles/ssh defaults. Port, root login, password authentication and the
# allowed users are inventory variables (inventory/hosts.yml).

# The hardening drop-in. "00-" so it sorts before every other drop-in:
# sshd keeps the first value it reads for a keyword.
ssh_hardening_dropin: /etc/ssh/sshd_config.d/00-leviosa-hardening.conf

---
# SSH Hardening Tasks
# - Key-only authentication (root: key only; no passwords anywhere)
# - Only root and the deploy user may log in
# - Modern algorithms, no forwarding, idle timeouts
# - Banner
#
# The keys themselves are roles/user's (operator keys) and roles/
# deploy_gate's (CI keys).

- name: Ensure SSH is installed
  ansible.builtin.apt:
    name: openssh-server
    state: present

- name: Add SSH banner
  ansible.builtin.copy:
    src: banner.txt
    dest: /etc/ssh/banner.txt
    owner: root
    group: root
    mode: '0644'

# Ubuntu's sshd_config already starts with this line; ensured so the drop-in
# below is read on any image.
- name: Read the sshd_config.d drop-ins
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^Include\s+/etc/ssh/sshd_config\.d/\*\.conf\s*$'
    line: 'Include /etc/ssh/sshd_config.d/*.conf'
    insertbefore: BOF
    state: present
  notify: Restart SSH

- name: Create the sshd_config.d directory
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: '0755'

# sshd re-reads its configuration for every new connection: a broken file
# would lock everyone out before any restart. `validate` checks the new file
# on its own before it replaces the old one.
- name: Install the SSH hardening drop-in
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: "{{ ssh_hardening_dropin }}"
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH

# And the whole configuration, main file and every drop-in, before the
# restart below.
- name: Test SSH configuration before applying
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -t
  register: ssh_sshd_test
  changed_when: false
  failed_when: ssh_sshd_test.rc != 0

- name: Ensure SSH is restarted after configuration
  ansible.builtin.meta: flush_handlers

- name: Ensure SSH service is enabled and running
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true

- name: Display SSH configuration summary
  ansible.builtin.debug:
    msg:
      - "==========================================="
      - "SSH Hardening Applied ({{ ssh_hardening_dropin }})"
      - "==========================================="
      - "Port: {{ ssh_port }}"
      - "Root login: {{ ssh_permit_root_login }}"
      - "Password auth: {{ ssh_password_authentication }}"
      - "Allowed users: {{ ssh_allowed_users | join(', ') }}"
      - "==========================================="

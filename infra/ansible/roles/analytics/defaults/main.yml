---
# Default variables for the analytics role
#
# HITL (docs/issues/008-cookieless-analytics.md): this role is opt-in.
# analytics_enabled stays false until the business owner has signed off on
# deploying Plausible (new self-hosted service: resourcing, DNS/subdomain,
# ongoing operational ownership). Flip it in group_vars once approved.
analytics_enabled: false

plausible_image: "plausible/analytics:v2"
clickhouse_image: "clickhouse/clickhouse-server:24.12-alpine"

# ClickHouse memory cap (bytes) — keeps the event store usable on small VPS
# instances alongside the app + monitoring stacks. See clickhouse-user-config.xml.j2.
analytics_clickhouse_max_memory_usage: "300000000"

---
# User Management Tasks
# - The keys file: checked before anything is written
# - The deploy user, in its own group only: not root-equivalent
# - Root's authorized_keys: the operator keys, nothing else
# - The deploy user's authorized_keys: the operator keys in a managed block,
#   below the CI keys' block that roles/deploy_gate writes at the top
#
# The deploy user's one sudoers rule (the root deploy runner) and the CI keys'
# forced command belong to roles/deploy_gate, which runs right after this
# role. Nothing here grants sudo.

# Every key is written into an authorized_keys line: one bare public key per
# entry ("<type> <base64> [comment]"), no options, no newline, or a key could
# smuggle in options or a second line.
- name: Check the keys file
  ansible.builtin.assert:
    that:
      - deploy_ssh_public_keys is sequence and deploy_ssh_public_keys is not string and deploy_ssh_public_keys is not mapping
      - deploy_ci_ssh_public_keys is sequence and deploy_ci_ssh_public_keys is not string and deploy_ci_ssh_public_keys is not mapping
      - deploy_ssh_public_keys | length > 0
      - (deploy_ssh_public_keys + deploy_ci_ssh_public_keys) | reject('string') | list | length == 0
      - (deploy_ssh_public_keys + deploy_ci_ssh_public_keys) | select('search', '[\r\n]') | list | length == 0
      - (deploy_ssh_public_keys + deploy_ci_ssh_public_keys) | reject('match', user_ssh_key_pattern) | list | length == 0
    fail_msg: >-
      The keys file is missing or malformed. `make setup` passes it with
      -e @<file> (default ~/leviosa-deploy-keys.yml, see
      deploy-keys.example.yml): deploy_ssh_public_keys must list at least one
      operator key, deploy_ci_ssh_public_keys the CI key(s), each entry a
      single bare public key ("<type> <base64> [comment]", no options, no
      newline).
    quiet: true

- name: Collect the keys' base64 blobs
  ansible.builtin.set_fact:
    user_operator_key_blobs: "{{ deploy_ssh_public_keys | map('split') | map(attribute=1) | list }}"
    user_ci_key_blobs: "{{ deploy_ci_ssh_public_keys | map('split') | map(attribute=1) | list }}"

# sshd uses the first line matching a key: a CI key also listed as an
# operator key would reach root and the deploy user's shell.
- name: Check no CI key is also an operator key
  ansible.builtin.assert:
    that:
      - user_ci_key_blobs | intersect(user_operator_key_blobs) | length == 0
    fail_msg: >-
      A key is in both deploy_ssh_public_keys and deploy_ci_ssh_public_keys.
      The CI key (leviosa-ci) belongs only in deploy_ci_ssh_public_keys.
    quiet: true

# Created first: the user module refuses `groups` naming a group that does
# not exist yet, and with an existing same-name group useradd would otherwise
# fall back to the shared `users` group.
- name: Create the deploy user's group
  ansible.builtin.group:
    name: "{{ deploy_user }}"
    state: present

- name: Create the deploy user, in its own group only
  # groups: its own group only, append: false. This also takes it out of
  # docker, sudo, admin and wheel, which are root-equivalent (roles/
  # deploy_gate refuses to finish otherwise). An empty list would report a
  # change on every run.
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    groups: ["{{ deploy_user }}"]
    append: false
    shell: /bin/bash
    home: "/home/{{ deploy_user }}"
    create_home: true
    state: present

# Older setups gave the deploy user docker, systemctl and journalctl rules in
# /etc/sudoers.d/<deploy_user>. Its one rule now lives in roles/deploy_gate's
# drop-in (/etc/sudoers.d/leviosa-deploy).
- name: Remove any other sudoers drop-in for the deploy user
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ deploy_user }}"
    state: absent

# Root's authorized_keys: the operator keys, one per computer, so each
# computer reaches root with its own key and no private key is copied
# between computers. The whole file: a key removed from the keys file loses
# root on the next run, and keys added by hand do not survive it. Never the
# CI keys. Hetzner installs Terraform's `terraform-leviosa` key at server
# creation: keep it in the keys file until your computers' keys work.
- name: Create root's .ssh directory
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Write root's authorized_keys from the operator keys
  ansible.builtin.copy:
    dest: /root/.ssh/authorized_keys
    content: |
      # Managed by Ansible (roles/user) from the keys file - DO NOT EDIT MANUALLY
      {% for key in deploy_ssh_public_keys %}
      {{ key }}
      {% endfor %}
    owner: root
    group: root
    mode: '0600'

# In --check against a fresh host the user creation above is only simulated:
# there is no home directory to write into yet.
- name: Look up the deploy user
  ansible.builtin.getent:
    database: passwd
    key: "{{ deploy_user }}"
    fail_key: false

- name: Create the deploy user's .ssh directory
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/.ssh"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0700'
  when: ansible_facts.getent_passwd[deploy_user] is not none

# The deploy user's file holds two managed blocks: the CI keys' block at the
# top (roles/deploy_gate: `restrict,command="<gate>" <key>`, so sshd forces a
# CI key to the gate even if it appears again below) and this block, the
# operator keys, unrestricted.
- name: Write the operator keys into the deploy user's authorized_keys
  ansible.builtin.blockinfile:
    path: "/home/{{ deploy_user }}/.ssh/authorized_keys"
    marker: "# {mark} operator keys, from the keys file (Ansible roles/user)"
    block: "{{ deploy_ssh_public_keys | join('\n') }}"
    insertafter: EOF
    create: true
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0600'
  when: ansible_facts.getent_passwd[deploy_user] is not none

# The equivalent of authorized_key's `exclusive`: every non-empty line that
# is neither a block marker nor carries a key of the keys file (operator or
# CI) goes, so a key added by hand does not survive a run either. The keys
# file is the only way in.
- name: Remove keys that are not in the keys file from the deploy user's authorized_keys
  ansible.builtin.lineinfile:
    path: "/home/{{ deploy_user }}/.ssh/authorized_keys"
    regexp: >-
      ^(?!# (BEGIN|END) )(?!.* ({{ (user_operator_key_blobs + user_ci_key_blobs) | map('regex_escape') | join('|') }})( |$)).+$
    state: absent
  when: ansible_facts.getent_passwd[deploy_user] is not none

- name: Display deploy user summary
  ansible.builtin.debug:
    msg:
      - "==========================================="
      - "Deploy User"
      - "==========================================="
      - "User: {{ deploy_user }} (own group only: no docker, sudo, admin or wheel)"
      - "sudo: the deploy runner only (roles/deploy_gate)"
      - "Operator keys: {{ deploy_ssh_public_keys | length }} (root and {{ deploy_user }}, unrestricted)"
      - "CI keys: {{ deploy_ci_ssh_public_keys | length }} ({{ deploy_user }} only, forced to the deploy gate)"
      - "==========================================="

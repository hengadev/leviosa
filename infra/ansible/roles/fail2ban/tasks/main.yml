---
# Fail2ban Configuration Tasks
# - SSH jails (brute force and connection floods)
# - Caddy jail on Caddy's JSON access logs (issue 026)
# - Notifications to the email read from Infisical prod /host

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Deploy fail2ban jail configuration
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.d/local.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart fail2ban

# Before the jail: fail2ban refuses a jail whose log file is missing, and
# roles/fail2ban runs before roles/app, roles/caddy and roles/shared_services
# (which starts Caddy). An empty root 0600 file is what Caddy creates itself;
# it appends to an existing one. Times preserved: a second run changes
# nothing. The directory, as roles/app lays it out.
- name: Create the Caddy log directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop: "{{ fail2ban_caddy_log_paths | map('dirname') | unique | list }}"
  when: fail2ban_caddy_enabled

- name: Create Caddy's access logs if Caddy has not yet
  ansible.builtin.file:
    path: "{{ item }}"
    state: touch
    owner: root
    group: root
    mode: "0600"
    access_time: preserve
    modification_time: preserve
  loop: "{{ fail2ban_caddy_log_paths }}"
  when: fail2ban_caddy_enabled

- name: Deploy Caddy rate-limit filter
  ansible.builtin.template:
    src: caddy-rate-limit.conf.j2
    dest: /etc/fail2ban/filter.d/caddy-rate-limit.conf
    owner: root
    group: root
    mode: '0644'
  when: fail2ban_caddy_enabled
  notify: Restart fail2ban

- name: Ensure fail2ban is enabled and started
  ansible.builtin.service:
    name: fail2ban
    state: "{{ 'started' if fail2ban_enabled else 'stopped' }}"
    enabled: "{{ fail2ban_enabled }}"

- name: Display fail2ban configuration summary
  ansible.builtin.debug:
    msg:
      - "==========================================="
      - "Fail2ban Configuration Applied"
      - "==========================================="
      - "SSH jail: maxretry={{ fail2ban_ssh_maxretry }}, bantime={{ fail2ban_ssh_bantime }}s"
      - "SSH DDoS jail: maxretry={{ fail2ban_ddos_maxretry }}, bantime={{ fail2ban_ddos_bantime }}s"
      - "Caddy jail: {{ 'enabled (' ~ fail2ban_caddy_log_paths | join(', ') ~ ')' if fail2ban_caddy_enabled else 'disabled' }}"
      - "Notifications: {{ fail2ban_notify_email }}"
      - "==========================================="

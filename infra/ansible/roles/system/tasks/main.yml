---
# System Hardening Tasks
# - Update system packages
# - Install the packages the deploy gate and the deploy script need
# - Set timezone
# - Configure automatic security updates
# - Harden kernel parameters
# - Secure shared memory
#
# The stack directories are roles/app's.

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist
  register: system_apt_upgrade
  retries: 3
  delay: 5
  until: system_apt_upgrade is succeeded

# git: the deploy runner fetches main into a root-only mirror (roles/
# deploy_gate). util-linux: flock, which the runner and infra/compose/deploy
# hold per stack. Both are usually present already; listed so a minimal
# image cannot break a deploy.
- name: Install essential packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - gnupg
      - htop
      - logrotate
      - unzip
      - util-linux
      - vim
      - wget
    state: present

- name: Set system timezone
  community.general.timezone:
    name: "{{ system_timezone }}"

- name: Configure automatic security updates
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  when: auto_security_updates

- name: Copy unattended-upgrades configuration
  ansible.builtin.template:
    src: unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: '0644'
  when: auto_security_updates
  notify: Restart unattended-upgrades

- name: Install apt-listchanges for update notifications
  ansible.builtin.apt:
    name: apt-listchanges
    state: present
  when: auto_security_updates

- name: Deploy apt-listchanges configuration
  ansible.builtin.template:
    src: apt-listchanges.conf.j2
    dest: /etc/apt/listchanges.conf
    mode: '0644'
  when: auto_security_updates

- name: Enable auto-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Unattended-Upgrade "1";
    mode: '0644'
  when: auto_security_updates

- name: Harden sysctl - IP spoofing protection
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: '1'
    state: present
    sysctl_set: true
    reload: true
  loop:
    - net.ipv4.conf.all.rp_filter
    - net.ipv4.conf.default.rp_filter

- name: Harden sysctl - Ignore ICMP redirects and disable source routing
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: '0'
    state: present
    sysctl_set: true
    reload: true
  loop:
    - net.ipv4.conf.all.accept_redirects
    - net.ipv4.conf.default.accept_redirects
    - net.ipv4.conf.all.send_redirects
    - net.ipv4.conf.default.send_redirects
    - net.ipv4.conf.all.accept_source_route
    - net.ipv4.conf.default.accept_source_route

- name: Harden sysctl - Enable TCP SYN cookies
  ansible.posix.sysctl:
    name: net.ipv4.tcp_syncookies
    value: '1'
    state: present
    sysctl_set: true
    reload: true

- name: Secure shared memory
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^tmpfs\s+/run/shm'
    line: 'tmpfs /run/shm tmpfs defaults,noexec,nosuid,size=64M 0 0'
    state: present
    backup: true

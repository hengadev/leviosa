---
# roles/deploy_gate defaults (issue 022). See README.md.

# The deploy user (created by roles/user). The CI keys log in as it; its only
# sudo right is the runner below.
deploy_gate_user: "{{ deploy_user | default('leviosa') }}"

# The CI keys' forced command (runs as the deploy user) and the root runner it
# reaches through sudo. Both root-owned, 0755.
deploy_gate_command: /usr/local/sbin/leviosa-deploy-gate
deploy_gate_runner: /usr/local/sbin/leviosa-deploy

# The sudoers drop-in holding the deploy user's one rule. No dot in the name:
# sudo's includedir skips files with one.
deploy_gate_sudoers_file: /etc/sudoers.d/leviosa-deploy

# CI public keys, one bare key per entry ("ssh-ed25519 AAAA… leviosa-ci"),
# written to the deploy user's authorized_keys as
#   restrict,command="<deploy_gate_command>" <key>
# The keys file that feeds this list is defined by the base Ansible rewrite
# (issue 025). An empty list removes the block.
deploy_gate_ci_keys: []

# Where root reads `deploy` and the compose files of the SHA it deploys. The
# repository is public, so no credential. Only main is ever fetched: GitHub
# also serves commits pushed to forks under this URL.
deploy_gate_repo_url: https://github.com/hengadev/leviosa.git

# Root-only (0700) state: the bare mirror of main (repo.git), each stack's
# extracted release (release-<stack>) and the locks.
deploy_gate_state_dir: /var/lib/leviosa-deploy

# Stack roots: where each stack's compose file is installed. They must match
# the defaults of infra/compose/deploy (which the runner starts with an empty
# environment) and infra/compose/README.md.
deploy_gate_stack_roots:
  prod: /opt/leviosa
  staging: /opt/leviosa-staging

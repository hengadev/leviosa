# ─────────────────────────────────────────────────────────────────────────────
# Leviosa local full-stack simulation, mirroring infra/compose/docker-compose.prod.yml
# (ADR-0016) as closely as a developer laptop allows. Started with
# `make local-start` (which copies .env.example to .env on first run); no hot
# reload — for the fast iteration loop use `make local-dev` instead.
#
# Same shape as production: the backend and frontend images built from the
# real production Dockerfiles (backend/Dockerfile, frontend/Dockerfile) with
# COMMIT_SHA=local, so /healthz reports "local" for both apps; the `migrate`
# and `admin` one-offs (./leviosa migrate, ./leviosa bootstrap-admin) run to
# completion before the backend starts, as `deploy <stack> <sha>` runs them on
# the server; the same healthchecks (busybox wget for the backend's alpine
# image, node + fetch for the distroless frontend, whose /healthz gates on the
# backend answering).
#
# Where it necessarily differs from production:
#
#   images    built here from the production Dockerfiles instead of pulled
#             from Docker Hub — there is no :<sha> tag to re-point, so
#             COMMIT_SHA=local stands in for the release SHA
#   config    one root .env (committed .env.example, no secrets; integrations
#             off) read through ${VAR:-default} interpolation, instead of the
#             Infisical Agent's per-consumer env files (ADR-0017). The
#             per-consumer split is still preserved: each service below gets
#             only the keys that consumer reads, the frontend never receives a
#             backend secret (database, AWS, encx, Stripe, Twilio, SMTP), and
#             the ADMIN_* values reach only the admin one-off
#   AWS       LocalStack stands in for S3 and KMS (ADR-0015): the
#             localstack-init one-shot creates the media bucket and the encx
#             KEK alias that Terraform provisions in deployed environments
#   one-offs  migrate and admin run on every `up` (production keeps them
#             behind the `oneoff` profile) — both are idempotent: migrate
#             applies only pending migrations, and bootstrap-admin never
#             touches an existing account
#   ports     both apps publish loopback host ports for the browser; on the
#             server only Caddy publishes anything
#   Caddy     deliberately excluded: on the VPS it only does hostname TLS
#             routing via Cloudflare's DNS-01 challenge (leviosa.care and
#             subdomains), and the admin/staff subdomain behavior lives in the
#             SvelteKit app (frontend/src/hooks.server.ts parses the hostname),
#             not in Caddy — so leaving it out costs no app behavior. With no
#             proxy in front, the frontend sets ORIGIN instead of the
#             PROTOCOL_HEADER/HOST_HEADER pair production uses: without either,
#             adapter-node assumes https and rejects form POSTs (login) as
#             CSRF with 403
#
# Everything here is intentionally ephemeral: no named volumes, so `make
# local-stop` (docker compose down -v) wipes Postgres and LocalStack — and with
# them the S3 bucket and the KMS key holding encx's KEK — together. A restart
# therefore never leaves Postgres pointing at data encrypted under a KMS key
# that no longer exists. Log in as the superadmin bootstrap-admin creates from
# the ADMIN_* values in .env, or re-seed with `go run ./cmd/seed` (from
# /backend) if you need more data.
# ─────────────────────────────────────────────────────────────────────────────
name: leviosa-local

# The backend image is shared by the backend service and the migrate/admin
# one-offs (as the :prod tag is shared on the server): built once from the
# production Dockerfile and tagged locally.
x-backend-image: &backend-image
  image: leviosa-backend:local
  build:
    context: ./backend
    dockerfile: Dockerfile
    args:
      # Stands in for the release SHA server images are built with; /health
      # and /healthz report it (backend/internal/app/release.go).
      COMMIT_SHA: local

# The backend's configuration, from the root .env (mirrors the key set of
# env/backend.env on the server; see infra/compose/test/fixtures/prod/env/).
# The migrate and admin one-offs load the same values — they are the same
# binary in other run modes.
x-backend-env: &backend-env
  ENVIRONMENT: production
  SERVER_PORT: ${BACKEND_PORT:-3500}
  # /db
  DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-leviosa}
  # /redis
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-secret}
  REDIS_DB: ${REDIS_DB:-0}
  # /rabbitmq — %2F is the URL-encoded default vhost ("/"); a bare trailing
  # slash parses as an empty vhost name, not the default one.
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/%2F
  # /encx — the KEK is a LocalStack KMS key created by localstack-init behind
  # this alias (ADR-0015); the pepper is the public dev value from .env.
  ENCX_KMS_KEY_ALIAS: alias/leviosa-dev
  ENCX_PEPPER: ${ENCX_PEPPER:-bGV2aW9zYS1sb2NhbC1kZXYtcGVwcGVyLTMyYnl0ZXM=}
  # Optional DEK-cache overrides (issue 031); empty means encx's defaults
  # (4096 entries, 10 minutes).
  ENCX_DEK_CACHE_MAX_ENTRIES: ${ENCX_DEK_CACHE_MAX_ENTRIES:-}
  ENCX_DEK_CACHE_TTL: ${ENCX_DEK_CACHE_TTL:-}
  # /aws — the endpoint overrides exist only because of LocalStack; deployed
  # environments point at real AWS and never set them.
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_ENDPOINT_URL: http://localstack:4566
  S3_ENDPOINT: http://localstack:4566
  S3_REGION: us-east-1
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-leviosa}
  S3_ACCESS_KEY_ID: test
  S3_SECRET_ACCESS_KEY: test
  # /app
  SESSION_SECRET: ${SESSION_SECRET:-local-dev-session-secret-change-me}
  BOOKING_TOKEN_SECRET: ${BOOKING_TOKEN_SECRET:-local-dev-booking-token-secret}
  FRONTEND_ORIGIN: http://localhost:${PORT:-3000}
  # /stripe, /twilio, /smtp, OAuth — integrations off in .env.example (empty
  # means disabled); fill them in .env to exercise one locally.
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_CONNECT_WEBHOOK_SECRET: ${STRIPE_CONNECT_WEBHOOK_SECRET:-}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
  TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
  TWILIO_REGION: ${TWILIO_REGION:-}
  TWILIO_EDGE: ${TWILIO_EDGE:-}
  TWILIO_SENDER: ${TWILIO_SENDER:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

services:
  # The Go backend (`serve`, the image's default command). It never migrates:
  # it refuses to start on a schema older than its embedded migrations, so the
  # migrate one-off runs first (and admin after it). Reached as
  # backend:3500 on the project network (the frontend's API_URL) and on a
  # loopback host port for direct poking.
  backend:
    <<: *backend-image
    environment:
      <<: *backend-env
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3500}:${BACKEND_PORT:-3500}"
    depends_on:
      admin:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
    healthcheck:
      # busybox wget (alpine image); SERVER_PORT matches the host port here.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${BACKEND_PORT:-3500}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # The SvelteKit server (adapter-node). Its environment block carries only
  # what the SvelteKit server reads — never a database, AWS, encx, Stripe,
  # Twilio, SMTP or admin value (mirrors env/frontend.env on the server).
  frontend:
    image: leviosa-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        COMMIT_SHA: local
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      API_URL: http://backend:${BACKEND_PORT:-3500}
      # No proxy in front locally (production derives the origin per host from
      # PROTOCOL_HEADER/HOST_HEADER behind Caddy instead): pin the single local
      # hostname, or adapter-node assumes https and 403s form POSTs as CSRF.
      ORIGIN: http://localhost:${PORT:-3000}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-leviosa_session}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-client-ip}
      COMING_SOON: ${COMING_SOON:-false}
      USE_MOCK_DATA: ${USE_MOCK_DATA:-false}
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Distroless image: no shell, wget or curl — node is the only tool.
      # /healthz is 200 only when the backend answers too (502 otherwise).
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:${PORT:-3000}/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # One-off: apply pending embedded migrations, then exit — as `deploy` runs
  # it before the new backend container starts, so a failed migration stops
  # here instead of crash-looping the app (see backend/cmd/app/migrate.go and
  # the migration rule in backend/CLAUDE.md).
  migrate:
    <<: *backend-image
    command: ["./leviosa", "migrate"]
    restart: "no"
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy

  # One-off: create the first superadmin from the ADMIN_* values (the only
  # service that receives them — the admin password never reaches the running
  # app), then exit. Safe on every `up`: it creates the account only when no
  # user with ADMIN_EMAIL exists and never modifies an existing one (see
  # backend/cmd/app/bootstrap_admin.go).
  admin:
    <<: *backend-image
    command: ["./leviosa", "bootstrap-admin"]
    restart: "no"
    environment:
      <<: *backend-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@local.leviosa.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Local-Admin-1234}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Local}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-Admin}
      ADMIN_TELEPHONE: ${ADMIN_TELEPHONE:-+33600000000}
      ADMIN_POSTAL_CODE: ${ADMIN_POSTAL_CODE:-75001}
      ADMIN_CITY: ${ADMIN_CITY:-Paris}
      ADMIN_ADDRESS1: ${ADMIN_ADDRESS1:-1 Rue Locale}
      ADMIN_ADDRESS2: ${ADMIN_ADDRESS2:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack-init:
        condition: service_completed_successfully

  # PostgreSQL, private to this stack (production's is shared with staging).
  # POSTGRES_USER/PASSWORD/DB apply at the first initdb only. No volume:
  # ephemeral by design (see the header).
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-leviosa}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # Over TCP: during the image's first initdb the temporary server only
      # listens on the Unix socket, which must not count as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis (sessions, OTPs, rate limits). The password goes into a config file
  # inside the container rather than onto the command line, where any host
  # user could read it in the process list — same as production. No volume:
  # ephemeral by design.
  redis:
    image: redis:7-alpine
    command:
      - sh
      - -ec
      - |
        umask 077
        printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        chown redis /tmp/redis.conf
        exec docker-entrypoint.sh /tmp/redis.conf
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # RabbitMQ, private to this stack (production's is shared with staging).
  # The management UI's port is published for local convenience.
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # LocalStack stands in for AWS: S3 (media) and KMS (the encx KEK, ADR-0015).
  localstack:
    image: localstack/localstack:4.6
    environment:
      SERVICES: s3,kms
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PERSISTENCE: 0
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: creates what the app expects but never creates itself — the S3
  # bucket and the encx KEK (a KMS key behind the alias the backend reads from
  # ENCX_KMS_KEY_ALIAS; must match the alias in x-backend-env above). This is
  # what Terraform provisions in deployed environments.
  localstack-init:
    image: amazon/aws-cli:2.36.19
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        aws s3 mb "s3://$$S3_BUCKET_NAME" || true
        if ! aws kms describe-key --key-id "$$KMS_KEY_ALIAS" > /dev/null 2>&1; then
          key_id=$$(aws kms create-key --description "Leviosa local encx KEK" --query KeyMetadata.KeyId --output text)
          aws kms create-alias --alias-name "$$KMS_KEY_ALIAS" --target-key-id "$$key_id"
        fi
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-leviosa}
      KMS_KEY_ALIAS: alias/leviosa-dev
    depends_on:
      localstack:
        condition: service_healthy
    restart: "no"

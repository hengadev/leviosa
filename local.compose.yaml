# Full local simulation of what's actually deployed to staging/production, driven entirely
# by containers. Mirrors infra/ansible/roles/app/templates/docker-compose.yml.j2 + env.j2 —
# same service shape and image pins (postgres:17-alpine, redis:7-alpine,
# rabbitmq:3-management-alpine, hashicorp/vault:1.15) that Ansible deploys.
#
# Staging isn't a separate shape worth reproducing here: on the real VPS it shares prod's
# Postgres/Redis/Caddy to save resources, which is a VPS optimization, not an app behavior
# difference — this standalone stack represents what both environments are built from.
#
# Caddy is deliberately excluded: on the VPS it only does hostname-based TLS routing via
# Cloudflare's DNS-01 challenge (leviosa.care / staff.leviosa.care / admin.leviosa.care).
# The admin/staff subdomain *behavior* itself is handled by the SvelteKit app
# (frontend/src/hooks.server.ts parses the hostname), not by Caddy, so there's no app
# behavior gap from leaving it out locally.
#
# Builds frontend/Dockerfile and backend/Dockerfile as-is (no hot reload) — for fast
# day-to-day iteration with live reload instead, use `make local-dev`.
#
# Usage: make local-start / make local-stop / make local-restart
#
# Everything here is intentionally ephemeral: no named volumes, so `docker compose down`
# wipes Postgres/Vault/LocalStack together. This avoids Postgres outliving a Vault dev-mode
# restart, which would leave encx-encrypted data undecryptable under a freshly generated key.
# Re-seed with `go run ./cmd/seed` (from /backend) after each local-start if you need data.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-leviosa}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-leviosa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-secret}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Dev-mode Vault: in-memory, auto-unsealed, root token. Not a persistence layer —
  # see the ephemeral-by-design note above. Mirrors backend/internal/common/testutils/vault.go.
  vault:
    image: hashicorp/vault:1.15
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-local-root-token}
      VAULT_ADDR: http://0.0.0.0:8200
      VAULT_API_ADDR: http://0.0.0.0:8200
      VAULT_DISABLE_MLOCK: "true"
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # One-shot: enables the transit secrets engine (KV v2 is already on by default in dev mode).
  # The backend auto-creates its KEK and pepper on first boot via encx once transit exists.
  vault-init:
    image: hashicorp/vault:1.15
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "vault secrets enable transit || true"
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-local-root-token}
    depends_on:
      vault:
        condition: service_healthy
    restart: "no"

  localstack:
    image: localstack/localstack:4.6
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PERSISTENCE: 0
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: creates the S3 bucket the app expects (the app never creates it itself —
  # see backend/test/helpers/const.go and the integration test setups for the same pattern).
  s3-init:
    image: amazon/aws-cli:2.36.19
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "aws --endpoint-url=http://localstack:4566 s3 mb s3://${S3_BUCKET_NAME:-leviosa} || true"
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      localstack:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      SERVER_PORT: ${BACKEND_PORT:-3500}
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-leviosa}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret}
      # %2F is the URL-encoded default RabbitMQ vhost ("/"); a bare trailing slash parses as an
      # empty vhost name, not the default one.
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/%2F
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-local-root-token}
      S3_ENDPOINT: http://localstack:4566
      S3_REGION: us-east-1
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-leviosa}
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      FRONTEND_ORIGIN: http://localhost:${PORT:-3000}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3500}:${BACKEND_PORT:-3500}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${BACKEND_PORT:-3500}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # No per-environment build args: the image is environment-agnostic and
      # reads everything below from its runtime environment.
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      API_URL: http://backend:${BACKEND_PORT:-3500}
      USE_MOCK_DATA: ${USE_MOCK_DATA:-false}
      COMING_SOON: ${COMING_SOON:-false}
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    depends_on:
      backend:
        condition: service_healthy

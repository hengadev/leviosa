# Full local simulation of what's actually deployed to staging/production, driven entirely
# by containers. Mirrors infra/ansible/roles/app/templates/docker-compose.yml.j2 + env.j2 —
# same service shape and image pins (postgres:17-alpine, redis:7-alpine,
# rabbitmq:3-management-alpine) that Ansible deploys. The encx KEK lives in LocalStack KMS
# here (AWS KMS when deployed, ADR-0015).
#
# Staging isn't a separate shape worth reproducing here: on the real VPS it shares prod's
# Postgres/Redis/Caddy to save resources, which is a VPS optimization, not an app behavior
# difference — this standalone stack represents what both environments are built from.
#
# Caddy is deliberately excluded: on the VPS it only does hostname-based TLS routing via
# Cloudflare's DNS-01 challenge (leviosa.care / staff.leviosa.care / admin.leviosa.care).
# The admin/staff subdomain *behavior* itself is handled by the SvelteKit app
# (frontend/src/hooks.server.ts parses the hostname), not by Caddy, so there's no app
# behavior gap from leaving it out locally.
#
# Builds frontend/Dockerfile and backend/Dockerfile as-is (no hot reload) — for fast
# day-to-day iteration with live reload instead, use `make local-dev`.
#
# Usage: make local-start / make local-stop / make local-restart
#
# Everything here is intentionally ephemeral: no named volumes, so `docker compose down`
# wipes Postgres/LocalStack together. This avoids Postgres outliving the LocalStack KMS key,
# which would leave encx-encrypted data undecryptable under a freshly created key.
# Re-seed with `go run ./cmd/seed` (from /backend) after each local-start if you need data.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-leviosa}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-leviosa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-secret}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  localstack:
    image: localstack/localstack:4.6
    environment:
      SERVICES: s3,kms
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PERSISTENCE: 0
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: creates what the app expects but never creates itself — the S3 bucket and the
  # encx KEK (a KMS key behind the alias the backend reads from ENCX_KMS_KEY_ALIAS).
  localstack-init:
    image: amazon/aws-cli:2.36.19
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        aws s3 mb "s3://$$S3_BUCKET_NAME" || true
        if ! aws kms describe-key --key-id "$$KMS_KEY_ALIAS" > /dev/null 2>&1; then
          key_id=$$(aws kms create-key --description "Leviosa local encx KEK" --query KeyMetadata.KeyId --output text)
          aws kms create-alias --alias-name "$$KMS_KEY_ALIAS" --target-key-id "$$key_id"
        fi
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-leviosa}
      KMS_KEY_ALIAS: alias/leviosa-dev
    depends_on:
      localstack:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      SERVER_PORT: ${BACKEND_PORT:-3500}
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-leviosa}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret}
      # %2F is the URL-encoded default RabbitMQ vhost ("/"); a bare trailing slash parses as an
      # empty vhost name, not the default one.
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/%2F
      # encx: KEK in LocalStack KMS (created by localstack-init), public dev pepper.
      ENCX_KMS_KEY_ALIAS: alias/leviosa-dev
      ENCX_PEPPER: ${ENCX_PEPPER:-bGV2aW9zYS1sb2NhbC1kZXYtcGVwcGVyLTMyYnl0ZXM=}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      S3_ENDPOINT: http://localstack:4566
      S3_REGION: us-east-1
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-leviosa}
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      FRONTEND_ORIGIN: http://localhost:${PORT:-3000}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3500}:${BACKEND_PORT:-3500}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${BACKEND_PORT:-3500}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-leviosa_session}
        CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-client-ip}
        BACKEND_PORT: ${BACKEND_PORT:-3500}
        COMING_SOON: ${COMING_SOON:-false}
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      API_URL: http://backend:${BACKEND_PORT:-3500}
      USE_MOCK_DATA: ${USE_MOCK_DATA:-false}
      COMING_SOON: ${COMING_SOON:-false}
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    depends_on:
      backend:
        condition: service_healthy

# Dev-mode backend stack: live reload via air (see local.Dockerfile), backed by real
# Postgres/Redis/RabbitMQ dependencies and LocalStack for S3 and KMS (the encx KEK) — same
# dependency shape as the production-mimicking stack at ../local.compose.yaml, but built
# for fast iteration instead of matching the shipped image.
#
# Usage: make local-dev (from repo root), or `docker compose up` from here directly.
# Ephemeral by design: no persistent volumes, so stopping the stack wipes Postgres together
# with the LocalStack KMS key its encrypted data depends on.
#
# Migrations: serve never migrates (it refuses an out-of-date schema), so air's build step
# runs the binary's `migrate` mode before every (re)start — see .air.toml.

name: leviosa-backend-dev

services:
  backend:
    build:
      context: .
      dockerfile: local.Dockerfile
    env_file:
      - development.env
    environment:
      ENVIRONMENT: development
      SERVER_PORT: "3500"
      DATABASE_URL: postgresql://user:password@postgres:5432/leviosa_dev
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: secret
      REDIS_DB: "0"
      # %2F is the URL-encoded default RabbitMQ vhost ("/"); a bare trailing slash parses as
      # an empty vhost name, not the default one.
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      # LocalStack as seen from inside the network; the KMS key alias, pepper, region and
      # credentials come from development.env (example.env), whose AWS_ENDPOINT_URL is the
      # host-side address for running tools outside Docker.
      AWS_ENDPOINT_URL: http://localstack:4566
      S3_ENDPOINT: http://localstack:4566
      S3_REGION: us-east-1
      S3_BUCKET_NAME: leviosa
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      FRONTEND_ORIGIN: http://localhost:5173
      SESSION_COOKIE_NAME: leviosa_session
      CLIENT_IP_HEADER: x-client-ip
    ports:
      - "127.0.0.1:3500:3500"
    volumes:
      - .:/app
      - /go/pkg/mod
      - /root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3500/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: leviosa_dev
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d leviosa_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass secret
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "secret", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  localstack:
    image: localstack/localstack:4.6
    environment:
      SERVICES: s3,kms
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PERSISTENCE: 0
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: creates what the app expects but never creates itself — the S3 bucket (see
  # backend/test/helpers/const.go and the integration test setups for the same pattern) and
  # the encx KEK: a KMS key behind the alias the backend reads from ENCX_KMS_KEY_ALIAS, as
  # Terraform provisions it in deployed environments. The backend refuses to start if the
  # alias doesn't resolve rather than creating a key.
  localstack-init:
    image: amazon/aws-cli:2.36.19
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        aws s3 mb "s3://$$S3_BUCKET_NAME" || true
        if ! aws kms describe-key --key-id "$$KMS_KEY_ALIAS" > /dev/null 2>&1; then
          key_id=$$(aws kms create-key --description "Leviosa local encx KEK" --query KeyMetadata.KeyId --output text)
          aws kms create-alias --alias-name "$$KMS_KEY_ALIAS" --target-key-id "$$key_id"
        fi
        echo "KEK $$KMS_KEY_ALIAS ready"
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET_NAME: leviosa
      # Must match ENCX_KMS_KEY_ALIAS in example.env / development.env.
      KMS_KEY_ALIAS: alias/leviosa-dev
    depends_on:
      localstack:
        condition: service_healthy
    restart: "no"
